html { scroll-behavior: smooth; }
body { margin: 0; }

/* ============ THEME TOKENS ============ */
.app-root, .theme-scope {
  --font-body: 'Inter', system-ui, sans-serif;
  --font-display: 'Inter', system-ui, sans-serif;
  --dw: 800;
  --blur: 0px;
  --sat: 100%;
  --radius: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --btn-hover: translateY(-2px);
  --btn-active-transform: translateY(0);
  --text-shadow: none;
  --deco: none;
}
.app-root {
  position: relative;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.app-root::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: var(--deco);
}
.app-root > * { position: relative; z-index: 1; }
.theme-scope { color: var(--fg); font-family: var(--font-body); background: var(--bg); }

/* ---- Glassmorphism ---- */
[data-theme='glass'] {

  --accent: linear-gradient(135deg,#7c5cff,#22d3ee); --accent-solid: #8b7bff; --on-accent: #fff;

  --btn-bg: rgba(255,255,255,.1); --btn-fg: #eef2ff; --btn-border: 1px solid rgba(255,255,255,.2); --btn-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  --btn-active-shadow: inset 0 2px 8px rgba(0,0,0,.35);
  --plate: rgba(255,255,255,.93); --plate-ink: #1f2937;

}

/* ============ COMPONENT CLASSES ============ */
.card {
  background: var(--surface); border: var(--border); box-shadow: var(--shadow); border-radius: var(--radius);
  backdrop-filter: blur(var(--blur)) saturate(var(--sat)); -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
}
.inset { background: var(--inset-bg); border: var(--inset-border); box-shadow: var(--inset-shadow); border-radius: var(--radius-sm); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem; cursor: pointer;
  background: var(--btn-bg); color: var(--btn-fg); border: var(--btn-border); box-shadow: var(--btn-shadow);
  border-radius: var(--radius-sm); padding: .6rem 1rem; font-weight: 600; font-size: .875rem; line-height: 1.1;
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; backdrop-filter: blur(calc(var(--blur) / 2));
  font-family: var(--font-body); white-space: nowrap;
}
.btn:hover { transform: var(--btn-hover); filter: brightness(1.04); }
.btn:active, .btn.on { box-shadow: var(--btn-active-shadow, var(--btn-shadow)); transform: var(--btn-active-transform); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.1) saturate(1.1); }
.btn-lg { padding: .95rem 1.6rem; font-size: 1rem; border-radius: var(--radius-sm); }
.chip {
  display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  background: var(--btn-bg); color: var(--btn-fg); border: var(--btn-border); box-shadow: var(--btn-shadow);
  border-radius: var(--radius-pill); padding: .38rem .8rem; font-size: .78rem; font-weight: 600;
  transition: all .18s ease; font-family: var(--font-body);
}
.chip:hover { transform: var(--btn-hover); }
.chip.on { background: var(--accent); color: var(--on-accent); box-shadow: var(--btn-active-shadow, var(--btn-shadow)); }
.field {
  width: 100%; background: var(--inset-bg); border: var(--inset-border); box-shadow: var(--inset-shadow); color: var(--fg);
  border-radius: var(--radius-sm); padding: .65rem .9rem; font-size: .9rem; outline: none; font-family: var(--font-body);
}
.field::placeholder { color: var(--muted); }
.field:focus { outline: 2px solid var(--accent-solid); outline-offset: 2px; }
select.field option { color: #111; }
.plate { background: var(--plate); color: var(--plate-ink); border-radius: var(--radius-sm); }
.muted { color: var(--muted); }
.font-display { font-family: var(--font-display); font-weight: var(--dw); letter-spacing: -.01em; }
h1.font-display, h2.font-display { text-shadow: var(--text-shadow); }
.accent-text { background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
[data-theme='brutal'] .accent-text { background: #ffde59; color: #000; padding: 0 .15em; -webkit-background-clip: border-box; box-shadow: 4px 4px 0 #000; border: 3px solid #000; display: inline-block; transform: rotate(-1.5deg); }
.tile {

.tile:hover { transform: translateY(-3px) scale(1.03); }
.tile.sel { outline: 3px solid var(--accent-solid); outline-offset: 2px; }
.sec-title { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
input[type='range'] { accent-color: var(--accent-solid); width: 100%; height: 22px; cursor: pointer; }
input[type='color'] { -webkit-appearance: none; appearance: none; width: 2.1rem; height: 2.1rem; border: var(--inset-border); background: none; border-radius: 10px; padding: 0; cursor: pointer; overflow: hidden; flex-shrink: 0; }

.no-scrollbar { scrollbar-width: none; }
.thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }

@keyframes floaty { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-18px) rotate(calc(var(--r,0deg) + 4deg)); } }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

@keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
@keyframes spin-slow { to { transform: rotate(360deg); } }
@keyframes pulse-ring { 0% { transform: scale(.8); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.floaty { animation: floaty 6s ease-in-out infinite; }
.marquee { animation: marquee 50s linear infinite; width: max-content; }
.marquee-rev { animation: marquee-rev 60s linear infinite; width: max-content; }
.marquee:hover, .marquee-rev:hover { animation-play-state: paused; }
.shimmer-text { background-size: 200% auto; animation: shimmer 5s linear infinite; }
.pop-in { animation: pop .3s ease both; }
